name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Audit public source and JavaScript syntax
        run: |
          node scripts/audit-public.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check resources/playground/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/smoke-windows.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-reconstruction.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type check and lint Rust
        run: |
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run Windows tests
        run: |
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-platform --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-engine playground::tests --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-engine analysis::tests --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-engine reconstruction::tests --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p quixi-engine providers::tests --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the complete release archive
        if: github.event_name != 'pull_request'
        run: ./scripts/package-windows.ps1 -SkipBuild
      - name: Upload portable package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quixidesk-windows-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quixidesk-windows-release
          path: release
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; retaining its verified assets. This build remains available as a workflow artifact."
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --verify-tag --draft --title "QuixiDesk Windows $RELEASE_TAG" --generate-notes
          fi
