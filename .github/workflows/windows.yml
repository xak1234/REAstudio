name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Verify release version and require an increase
        env:
          REA_VERSION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before || '') }}
        run: node scripts/check-version.mjs
      - name: Prepare the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Audit public source and JavaScript syntax
        run: |
          node scripts/audit-public.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/run-integration-checks.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'rea-studio-validation')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Type check and lint Rust
        run: |
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run Windows tests
        run: |
          cargo build --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'rea-studio-validation'
          New-Item $out -ItemType Directory -Force | Out-Null
          $suites = @(
            @{package='quixi-platform';filter=''},
            @{package='quixi-workspace';filter=''},
            @{package='quixi-mcp';filter=''},
            @{package='quixi-engine';filter='ida::tests'},
            @{package='quixi-engine';filter='debugger::tests'},
            @{package='quixi-engine';filter='decompile::tests'},
            @{package='quixi-engine';filter='playground::tests'},
            @{package='quixi-engine';filter='analysis::tests'},
            @{package='quixi-engine';filter='analysis::investigations::tests'},
            @{package='quixi-engine';filter='reconstruction::tests'},
            @{package='quixi-engine';filter='providers::tests'},
            @{package='quixi-app';filter=''}
          )
          $receipts = @()
          foreach ($suite in $suites) {
            $arguments = @('test','--release','-p',$suite.package,'--locked')
            if ($suite.filter) { $arguments += $suite.filter }
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $lines = @(& cargo @arguments 2>&1)
            $code = $LASTEXITCODE
            $clock.Stop()
            $name = $suite.package + $(if ($suite.filter) { '-' + $suite.filter.Replace('::','-') })
            $lines | Tee-Object -FilePath (Join-Path $out ($name + '.log'))
            $counts = [regex]::Matches(($lines -join "`n"), 'test result:.*? (\d+) passed; (\d+) failed; (\d+) ignored;')
            $passed = 0; $failed = 0; $ignored = 0
            foreach ($count in $counts) {
              $passed += [int]$count.Groups[1].Value
              $failed += [int]$count.Groups[2].Value
              $ignored += [int]$count.Groups[3].Value
            }
            $status = if ($code -eq 0 -and ($passed + $failed + $ignored) -gt 0) { 'passed' } else { 'failed' }
            $receipts += [pscustomobject]@{suite=$name;status=$status;exitCode=$code;passed=$passed;failed=$failed;ignored=$ignored;durationMs=$clock.ElapsedMilliseconds}
            $receipts | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'rust-tests.json') -Encoding utf8
            if ($status -eq 'failed') { exit 1 }
          }
      # Licensed/live tests are #[ignore] and appear as ignored in cargo's summary.
      # Select them explicitly with -- --ignored --nocapture on a configured test host.
      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-studio-validation
          path: ${{ runner.temp }}/rea-studio-validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Build the complete release archive
        if: github.event_name != 'pull_request'
        run: ./scripts/package-windows.ps1 -SkipBuild
      - name: Upload portable package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-studio-windows-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rea-studio-windows-release
          path: release
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; retaining its verified assets. This build remains available as a workflow artifact."
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --verify-tag --draft --title "REA Studio $RELEASE_TAG" --generate-notes
          fi
